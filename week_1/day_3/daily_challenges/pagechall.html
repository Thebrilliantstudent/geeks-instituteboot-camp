  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
    }
    input {
      padding: 10px;
      font-size: 16px;
      width: 300px;
      border: 2px solid #ccc;
      border-radius: 4px;
    }
    label {
      display: block;
      margin-bottom: 10px;
      font-weight: bold;
    }
  </style>

  <label for="letterInput">Enter letters only:</label>
  <input type="text" id="letterInput" placeholder="Type here...">

  <script>
    const input = document.getElementById('letterInput');

   

    //: Using input event (removes non-letters after typing)
    
    input.addEventListener('input', function(event) {
      this.value = this.value.replace(/[^a-zA-Z]/g, '');
    });

  </script>
