  <h1>My Book List</h1>
    <section class="listBooks"></section>
  <table>
  <script>
    let table = document.body.firstElementChild;
    
    // Get all rows
    let rows = table.rows;
    
    // Loop through each row
    for (let i = 0; i < rows.length; i++) {
      // Color the cell where row index equals column index (diagonal)
      rows[i].cells[i].style.backgroundColor = 'red';
    }
  </script>
   <script>
     // Book list data
    
        const allBooks = [
            {
                title: "Harry Potter and the Philosopher's Stone",
                author: "J.K. Rowling",
                image: "https://covers.openlibrary.org/b/id/7725635-M.jpg",
                alreadyRead: true
            },
            {
                title: "The Great Gatsby",
                author: "F. Scott Fitzgerald",
                image: "https://covers.openlibrary.org/b/id/7725454-M.jpg",
                alreadyRead: false
            }
        ];

       
        const listBooksSection = document.querySelector('.listBooks');

       
        allBooks.forEach(book => {
           
            const bookDiv = document.createElement('div');
            bookDiv.className = 'book';

           
            const bookDetails = document.createElement('div');
            bookDetails.className = 'book-details';
            if (book.alreadyRead) {
                bookDetails.classList.add('read');
            }

         
            const bookImage = document.createElement('img');
            bookImage.src = book.image;
            bookImage.alt = book.title;
            bookDiv.appendChild(bookImage);

           
            bookDetails.innerHTML = `<strong>${book.title}</strong> written by ${book.author}.`;
            bookDiv.appendChild(bookDetails);

    
            listBooksSection.appendChild(bookDiv);
        });
  </script>
  <script>
    function createCalendar(year, month) {
  // Get the first day of the month (0 = Sunday, 1 = Monday, etc.)
  const firstDay = new Date(year, month - 1, 1).getDay();
  
  // Get the number of days in the month
  const daysInMonth = new Date(year, month, 0).getDate();
  
  // Create the table element
  const table = document.createElement('table');
  
  // Create the header row with weekday names
  const thead = document.createElement('thead');
  const headerRow = document.createElement('tr');
  const weekdays = ['MO', 'TU', 'WE', 'TH', 'FR', 'SA', 'SU'];
  
  weekdays.forEach(day => {
    const th = document.createElement('th');
    th.textContent = day;
    headerRow.appendChild(th);
  });
  
  thead.appendChild(headerRow);
  table.appendChild(thead);
  
  // Create the table body
  const tbody = document.createElement('tbody');
  
  // Adjust firstDay: convert from Sunday=0 to Monday=0
  // Sunday (0) becomes 6, Monday (1) becomes 0, etc.
  const adjustedFirstDay = firstDay === 0 ? 6 : firstDay - 1;
  
  let currentDay = 1;
  let row = document.createElement('tr');
  
  // Fill empty cells before the first day of the month
  for (let i = 0; i < adjustedFirstDay; i++) {
    const td = document.createElement('td');
    td.textContent = '.';
    row.appendChild(td);
  }
  
  // Fill in the days of the month
  for (let i = adjustedFirstDay; i < 7; i++) {
    const td = document.createElement('td');
    td.textContent = currentDay;
    row.appendChild(td);
    currentDay++;
  }
  
  tbody.appendChild(row);
  
  // Create remaining rows
  while (currentDay <= daysInMonth) {
    row = document.createElement('tr');
    
    for (let i = 0; i < 7 && currentDay <= daysInMonth; i++) {
      const td = document.createElement('td');
      td.textContent = currentDay;
      row.appendChild(td);
      currentDay++;
    }
    
    // Fill remaining cells with dots if needed
    while (row.children.length < 7) {
      const td = document.createElement('td');
      td.textContent = '.';
      row.appendChild(td);
    }
    
    tbody.appendChild(row);
  }
  
  table.appendChild(tbody);
  
  // Append the table to the document body (or wherever you want)
  document.body.appendChild(table);
}

// Example usage:
createCalendar(2012, 9);
